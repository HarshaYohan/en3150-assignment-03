# Run: model_b__adam__seed42                      Owner: Member 3
# Notebook: notebooks/03_optimizer_study.ipynb
# The headline resource-constrained model. Serves Section 3 (chosen optimizer),
# Section 4 (A-vs-B table) and Section 6 (vs the SOTA backbones).
extends: [data, models, training, evaluation]

model:
  name: model_b

optimizer:
  name: adam
  lr: 0.001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

notes: >-
  Adam is the chosen optimizer. Justification for Section 3: depthwise kernels
  carry 9 weights each while pointwise kernels carry hundreds, so their
  gradient magnitudes differ by orders of magnitude and a single global SGD
  learning rate cannot serve both. Adam's per-parameter adaptive step does.
