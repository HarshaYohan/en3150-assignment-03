# Run: squeezenet1_1__adam__seed42                Owner: Member 4
# Notebook: notebooks/05_pretrained_finetuning.ipynb
# Section 5 - lightweight SOTA backbone #2, fine-tuned on the SAME splits.
extends: [data, models, pretrained, training, evaluation]

model:
  name: squeezenet1_1

optimizer:
  name: adam
  lr: 0.001            # head LR; backbone gets lr x pretrained.backbones[].backbone_lr_scale
  betas: [0.9, 0.999]
  weight_decay: 0.0001

notes: >-
  SqueezeNet's fire modules squeeze then expand with 1x1 convolutions - a
  different route to parameter efficiency than MobileNet's depthwise
  separables. Contrasting the two mechanisms, rather than just their accuracy
  numbers, is what Section 6 rewards.
