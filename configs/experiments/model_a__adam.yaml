# Run: model_a__adam__seed42                      Owner: Member 3
# Notebook: notebooks/04_custom_training_evaluation.ipynb
# Section 4 - the standard-CNN baseline that Model B is compared against.
#
# Only what makes this run distinct lives here. Everything else (epochs,
# scheduler, augmentation, ...) comes from the stages listed in `extends`.
extends: [data, models, training, evaluation]

model:
  name: model_a

optimizer:
  name: adam
  lr: 0.001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

notes: >-
  Unconstrained standard CNN. Its parameter count and MACs are the reference
  point for the Section 4 discussion of what depthwise-separable convolutions
  actually cost and save.
