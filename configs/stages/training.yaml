# ===========================================================================
# STAGE 3 - TRAINING & OPTIMIZATION        Assignment Sections 3 [15] + 4 [25]
#
# Owner:     Member 3
# Notebooks: notebooks/03_optimizer_study.ipynb
#            notebooks/04_custom_training_evaluation.ipynb
#            (also used unchanged by 05_pretrained_finetuning, Member 4)
# Code:      src/edgecnn/training/
#
# There is deliberately NO `optimizer` section here. Every experiment file
# defines its optimizer in full. Configs merge recursively, so a default
# optimizer here would leak keys across optimizers - e.g. Adam's `betas`
# landing inside an SGD run. The optimizer lives in exactly one place: the
# experiment file that names it.
# ===========================================================================

# --- SETTINGS --------------------------------------------------------------

training:
  epochs: 30                   # assignment minimum is 20; 30 leaves headroom
                               # for early stopping to actually trigger
  loss: cross_entropy
  label_smoothing: 0.0
  grad_clip_norm: null
  amp: false                   # keep off: mixed precision distorts the epoch
                               # timings that Section 4 compares
  resume: false                # true -> continue from last.pt after an interruption

scheduler:
  # Shared by every run: the three Section 3 variants must use the same
  # schedule, or the comparison confounds the optimizer with the schedule.
  name: cosine                 # none | step | cosine | reduce_on_plateau
  warmup_epochs: 0
  min_lr: 0.00001

early_stopping:
  enabled: true
  monitor: val_acc
  mode: max
  patience: 8
  # Early stopping never fires before this. The assignment mandates at least
  # 20 epochs and history.schema.json enforces minItems: 20.
  min_epochs: 20

checkpointing:
  monitor: val_acc
  mode: max
  save_best: true
  save_last: true

# Section 3: which experiment files make up the optimizer study. The
# hyperparameters live in those files - this list only names them.
# Must agree with reporting.tables[optimizer_comparison].runs (tested).
optimizer_study:
  model: model_b                  # the resource-constrained model is the subject
  experiments: [model_b__sgd, model_b__sgd_momentum, model_b__adam]

# --- SEAM 3 declaration ----------------------------------------------------

stages:
  training:
    owner: member_3
    produces_for: [member_1, member_4]
    settings: [training, scheduler, early_stopping, checkpointing, optimizer_study]

    inputs:
      data:      "SEAM 1: edgecnn.data.build_dataloaders(cfg) -> DataBundle"
      model:     "SEAM 2: edgecnn.models.build_model_from_config(cfg, num_classes)"
      optimizer: "the `optimizer` section of the experiment file"

    # Written only in official mode. Debug checkpoints go to
    # artifacts/checkpoints/_debug/<run_id>/ and no history is written.
    outputs:
      checkpoint_best: artifacts/checkpoints/{run_id}/best.pt   # git-ignored
      checkpoint_last: artifacts/checkpoints/{run_id}/last.pt   # git-ignored
      history:         results/metrics/{run_id}/history.json    # COMMITTED
      curves_figure:   results/figures/{run_id}/curves.png      # COMMITTED

    contract:
      python_api: >-
        edgecnn.training.Trainer(cfg).fit(model, data, cfg)
        -> edgecnn.contracts.TrainResult (always returned, in every mode)
      schemas:
        history: configs/contracts/history.schema.json
      checkpoint_keys:
        [model_name, state_dict, epoch, val_acc, class_names, input_shape, seed, config_snapshot]
      guarantees:
        - "NEVER touches DataBundle.test - the held-out split stays clean until evaluation"
        - "never imports a model module directly; only the registry, so the loop is model-agnostic"
        - "epoch_time_s covers the train pass plus the val pass, measured identically for every model"
        - "records at least 20 epochs in history.json"
        - "writes into results/ only when cfg.is_official"
        - "reseeds from cfg.seed at the start of fit, so results do not depend on earlier notebook cells"
