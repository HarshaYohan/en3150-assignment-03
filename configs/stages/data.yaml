# ===========================================================================
# STAGE 1 - DATA                                        Assignment Section 1
#
# Owner:     Member 1
# Notebook:  notebooks/01_data_preparation.ipynb
# Code:      src/edgecnn/data/
#
# Layout - identical in every stage file:
#   top-level sections   SETTINGS. Each setting has exactly one home across all
#                        stage files, and experiments override the same path.
#                        tests/contracts/test_config_layout.py enforces this.
#   stages.data          this stage's SEAM declaration: owner, what it
#                        consumes, what it produces, what others may assume.
# ===========================================================================

# --- SETTINGS --------------------------------------------------------------

dataset:
  # 'eurosat' for real runs. 'synthetic' switches to the generated fixture in
  # tests/fixtures/ - select it with MODE = "synthetic", not by editing here.
  name: eurosat
  source: torchvision
  torchvision_class: EuroSAT
  root: data/raw
  download: true
  # EuroSAT is already 64x64, so no resize is applied. Switch to 'bilinear'
  # if the team ever changes dataset.
  resize_mode: none
  # Recorded for the report's dataset citation (Section 1).
  citation: >-
    Helber et al., "EuroSAT: A Novel Dataset and Deep Learning Benchmark for
    Land Use and Land Cover Classification", IEEE JSTARS, 2019.
  expected_num_classes: 10
  expected_num_images: 27000

split:
  train: 0.70
  val: 0.15
  test: 0.15
  stratified: true             # preserve class proportions in all three splits
  # Pinned independently of the training seed in base.yaml, so a run with a
  # different training seed still sees exactly the same split.
  seed: 42

# Applied to the TRAIN split only. Val and test are never augmented -
# augmenting them would make the reported numbers unreproducible.
augmentation:
  train:
    - random_horizontal_flip
    - random_vertical_flip     # valid for overhead satellite imagery
    - random_rotation_90
  val: []
  test: []

normalization:
  # Statistics are COMPUTED from the train split, never hard-coded and never
  # fitted on val or test. Enforced by norm_stats.schema.json. Pretrained runs
  # may switch to ImageNet statistics - see pretrained.normalization.
  fit_on: train

# --- SEAM 1 declaration ----------------------------------------------------

stages:
  data:
    owner: member_1
    produces_for: [member_2, member_3, member_4]
    settings: [dataset, split, augmentation, normalization]

    inputs:
      source: EuroSAT via torchvision, downloaded to data/raw

    # These paths are the entire surface Members 2, 3 and 4 see.
    # Written only in official mode.
    outputs:
      processed_dir:  data/processed/eurosat_64     # git-ignored, regenerable
      split_manifest: data/splits/split_manifest.csv  # COMMITTED
      split_meta:     data/splits/split_meta.json     # COMMITTED
      norm_stats:     data/splits/norm_stats.json     # COMMITTED

    # What downstream members are entitled to assume. Enforced at runtime by
    # edgecnn.contracts.schema and by tests/contracts/.
    contract:
      python_api: edgecnn.data.build_dataloaders(cfg) -> edgecnn.contracts.DataBundle
      schemas:
        split_manifest: configs/contracts/split_manifest.schema.json
        split_meta:     configs/contracts/split_meta.schema.json
        norm_stats:     configs/contracts/norm_stats.schema.json
      manifest_columns: [relative_path, label_index, label_name, split]
      batch:
        images:
          dtype: float32
          shape: [B, 3, 64, 64]
          normalized: true
        labels:
          dtype: int64
          shape: [B]
          range: "[0, num_classes)"
      guarantees:
        - "class_names ordering is frozen once split_meta.json is committed"
        - "normalisation statistics are fitted on the train split only"
        - "the same manifest is used by every model, so splits are identical"
        - "test rows are never returned by the train or val loaders"
        - "on a fresh clone, missing images are fetched to match the committed split - it is never redrawn"
